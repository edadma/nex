name: Deploy docs to Pages

on:
  push:
    branches: [dev]
    paths:
      - 'docs/**'
      - '.github/workflows/deploy-docs.yml'
  workflow_dispatch:

# GitHub Pages permissions
permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deploy; don't cancel in-progress runs.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout nex
        uses: actions/checkout@v4
        with:
          path: nex

      # juicer lives in a sibling repo. Clone its stable branch so we
      # build with the same version juicer.run itself uses in production.
      - name: Checkout juicer
        uses: actions/checkout@v4
        with:
          repository: edadma/juicer
          ref: stable
          path: juicer

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up sbt
        uses: sbt/setup-sbt@v1

      - name: Set up Node (for sass + esbuild)
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install sass and esbuild
        run: npm install -g sass esbuild

      - name: Cache sbt
        uses: actions/cache@v4
        with:
          path: |
            ~/.sbt
            ~/.cache/coursier
            ~/.ivy2/cache
          key: ${{ runner.os }}-sbt-${{ hashFiles('juicer/**/build.sbt', 'juicer/**/project/build.properties', 'juicer/**/project/plugins.sbt') }}
          restore-keys: |
            ${{ runner.os }}-sbt-

      - name: Build docs
        working-directory: juicer
        run: |
          sbt --error "juicerJVM/run build -s ../nex/docs -d ../nex/docs/_site"

      # GitHub Pages requires a CNAME file in the site root to route the
      # custom domain. Generated here rather than checked in so the source
      # tree stays clean.
      - name: Add CNAME for nexlang.org
        run: echo "nexlang.org" > nex/docs/_site/CNAME

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: nex/docs/_site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
